<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<title>TCD SNAP タグ検索</title>
<style>
:root{--bg:#fff7fa;--bg2:#eef6ff;--fg:#4a3b42;--sub:#a08b95;--acc:#ff7fa5;--acc2:#b79cff;--acc-bg:#ffe3ec;--line:#ffd6e3;--card:#fff;--shadow:0 6px 18px rgba(255,127,165,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#231a20;--bg2:#1c2030;--fg:#f5e8ee;--sub:#c4a9b6;--acc:#ff9ebb;--acc2:#c8b3ff;--acc-bg:#4d2a3a;--line:#5a3546;--card:#2e232a;--shadow:0 6px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",sans-serif;line-height:1.5;
background:radial-gradient(circle at 12px 12px,rgba(255,127,165,.12) 2px,transparent 2.5px) 0 0/28px 28px,linear-gradient(160deg,var(--bg),var(--bg2)) fixed}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 16px;text-align:center;color:var(--acc);letter-spacing:.08em;text-shadow:2px 2px 0 var(--acc-bg)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;padding:9px 14px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);outline:none}
input:focus,select:focus{border-color:var(--acc)}
input{flex:1;min-width:160px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 14px;font:inherit;font-size:13px;cursor:pointer;transition:transform .15s}
.chip:hover{transform:translateY(-2px) scale(1.05)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:var(--shadow)}
.chip small{opacity:.7;margin-left:4px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:8px 0 14px;gap:8px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--acc);cursor:pointer;font:inherit;padding:0;text-decoration:underline dotted}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;align-items:start}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s}
.card:hover{transform:translateY(-4px) rotate(-.6deg)}
.card img{width:100%;height:auto;display:block;background:var(--line)}
.body{padding:10px 12px 12px}
.name{font-weight:bold;font-size:16px}.date{font-size:12px;color:var(--sub)}
.t{display:inline-block;font-size:12px;background:var(--acc-bg);color:var(--acc);border-radius:999px;padding:1px 10px;margin:5px 4px 0 0}
.sns{margin-top:8px;font-size:12px}.sns a{color:#fff;background:var(--acc2);border-radius:999px;padding:2px 10px;margin-right:6px;text-decoration:none}
#pick{margin-bottom:22px;padding:14px;background:rgba(255,255,255,.55);border:3px dashed var(--acc);border-radius:26px}
@media(prefers-color-scheme:dark){#pick{background:rgba(255,255,255,.05)}}
#pick .meta{margin:0 0 12px;font-size:17px;color:var(--acc)}
.empty{text-align:center;color:var(--sub);padding:40px 0}
</style></head><body><div class="wrap">
<h1>♡ TCD SNAP タグ検索 ♡</h1>
<section id="pick"><div class="meta"><b id="picktitle">💗 今日のピックアップ</b><button class="link" id="reroll">🎲 別のスナップを見る</button></div><div class="grid" id="pickgrid"></div></section>
<div class="bar">
<input id="q" type="search" placeholder="名前で検索">
<select id="mode"><option value="and">選んだタグをすべて含む</option><option value="or">選んだタグのどれかを含む</option></select>
<select id="sort"><option value="new">新しい順</option><option value="old">古い順</option><option value="name">名前順</option></select>
</div>
<div class="tags" id="tags"></div>
<div class="meta"><span id="count"></span><button class="link" id="clear">✕ 絞り込みをクリア</button></div>
<div class="grid" id="grid"></div>
</div>
<script>
const CSV_URL = "snap.csv";
const IMG_BASE = "https://www.tokyo-crossdress.com/WBlog/";
const ADMIN = new URLSearchParams(location.search).has("admin");
let DATA = [], counts = {}, allTags = [];
const sel = new Set();
const $ = id => document.getElementById(id);
const safe = u => /^https?:\/\//.test(u) ? u : "";

function parseCSV(t){
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && t[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function toData(rows){
  const h = rows[0].map(s => s.trim());
  const col = n => h.indexOf(n);
  const tagCols = h.map((s,i) => /^タグ[0-9０-９]+$/.test(s) ? i : -1).filter(i => i >= 0);
  const get = (r, n) => { const i = col(n); return i < 0 ? "" : (r[i] || "").trim(); };
  const out = [];
  rows.slice(1).forEach(r => {
    const id = get(r, "ID");
    if (!/^\d{8,}$/.test(id)) return;
    const tags = [...new Set(tagCols.map(i => (r[i] || "").trim()).filter(Boolean))];
    out.push({ id, name: get(r, "名前"), date: id.slice(0,4)+"-"+id.slice(4,6)+"-"+id.slice(6,8),
      img: get(r, "画像URL") || (IMG_BASE + id + "-600.jpg"),
      x: get(r, "Twitter(X)"), ig: get(r, "Instagram"), tags });
  });
  return out;
}

function makeCard(d){
  const c = document.createElement("div"); c.className = "card";
  if (safe(d.img)){ const i = document.createElement("img"); i.src = d.img; i.alt = d.name; i.loading = "lazy"; c.append(i); }
  const b = document.createElement("div"); b.className = "body";
  if (d.name){ const n = document.createElement("div"); n.className = "name"; n.textContent = d.name + " 様"; b.append(n); }
  const dt = document.createElement("div"); dt.className = "date"; dt.textContent = d.date; b.append(dt);
  d.tags.forEach(t => { const s = document.createElement("span"); s.className = "t"; s.textContent = t; b.append(s); });
  if (ADMIN && !d.tags.length){ const s = document.createElement("span"); s.className = "t"; s.style.cssText = "background:#d33;color:#fff"; s.textContent = "タグ未設定"; b.append(s); }
  const sns = document.createElement("div"); sns.className = "sns";
  [["X", d.x], ["Instagram", d.ig]].forEach(([l,u]) => { if (safe(u)){ const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener"; a.textContent = l; sns.append(a); }});
  b.append(sns); c.append(b); return c;
}
function drawTags(){
  const box = $("tags"); box.textContent = "";
  allTags.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip" + (sel.has(t) ? " on" : "");
    b.textContent = t;
    const s = document.createElement("small"); s.textContent = counts[t]; b.append(s);
    b.onclick = () => { sel.has(t) ? sel.delete(t) : sel.add(t); render(); };
    box.append(b);
  });
}
function render(){
  drawTags();
  const q = $("q").value.trim().toLowerCase(), mode = $("mode").value, sort = $("sort").value;
  let list = DATA.filter(d => {
    if (q && !d.name.toLowerCase().includes(q)) return false;
    if (!sel.size) return true;
    const has = t => d.tags.includes(t);
    return mode === "and" ? [...sel].every(has) : [...sel].some(has);
  });
  list.sort((a,b) => sort==="name" ? a.name.localeCompare(b.name,"ja")
    : sort==="old" ? a.id.localeCompare(b.id) : b.id.localeCompare(a.id));
  let msg = list.length + " 件 / 全 " + DATA.length + " 件";
  if (ADMIN) msg += "(タグ未設定 " + DATA.filter(d => !d.tags.length).length + " 件)";
  $("count").textContent = msg;
  const g = $("grid"); g.textContent = "";
  if (!list.length){ const e = document.createElement("div"); e.className="empty"; e.textContent="該当するスナップがありません"; g.append(e); return; }
  list.forEach(d => g.append(makeCard(d)));
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(rnd, n){const a=DATA.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function drawPick(list, title){const g=$("pickgrid");g.textContent="";$("picktitle").textContent=title;list.forEach(d=>g.append(makeCard(d)))}

async function init(){
  try{
    const res = await fetch(CSV_URL, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    DATA = toData(parseCSV(await res.text()));
  }catch(e){
    const m = document.createElement("div"); m.className = "empty";
    m.textContent = "データ(snap.csv)を読み込めませんでした。時間をおいて再読み込みしてください。";
    $("grid").append(m); $("pick").style.display = "none"; return;
  }
  DATA.forEach(d => d.tags.forEach(t => counts[t] = (counts[t]||0)+1));
  allTags = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const jst = new Date(Date.now()+9*3600e3), seed = jst.getUTCFullYear()*10000+(jst.getUTCMonth()+1)*100+jst.getUTCDate();
  drawPick(pick(mulberry(seed),3),"💗 今日のピックアップ");
  $("reroll").onclick = () => drawPick(pick(Math.random,3),"🎀 ランダムピックアップ");
  $("q").oninput = render; $("mode").onchange = render; $("sort").onchange = render;
  $("clear").onclick = () => { sel.clear(); $("q").value = ""; render(); };
  render();
}
init();
</script></body></html>
